<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c162e" />
      <stop offset="100%" stop-color="#08080f" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners and border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="2" />

  <!-- Ambient glow -->
  <path d="M32 14L48 32L32 50L16 32Z" stroke="#f59e0b" stroke-width="5" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Outer diamond frame -->
  <path d="M32 14L48 32L32 50L16 32Z" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Inner core glowing diamond -->
  <path d="M32 23.5L39.5 32L32 40.5L24.5 32Z" fill="url(#amberGrad)" />

  <!-- Graph node endpoints -->
  <circle cx="32" cy="14" r="2.5" fill="#fde68a" />
  <circle cx="48" cy="32" r="2.5" fill="#f59e0b" />
  <circle cx="32" cy="50" r="2.5" fill="#d97706" />
  <circle cx="16" cy="32" r="2.5" fill="#f59e0b" />
</svg>
